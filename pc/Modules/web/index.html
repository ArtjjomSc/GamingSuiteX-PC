<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GamingSuite X">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<title>GamingSuite X</title>
<style>
  :root {
    --bg: #0b0d12; --bar: #10141c; --card: #151a23; --border: #262d3a;
    --accent: #4ade80; --cyan: #22d3ee; --warn: #fbbf24; --crit: #f87171; --info: #60a5fa;
    --text: #e5e7eb; --dim: #9ca3af;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bar);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; letter-spacing: 3px; margin: 0; font-weight: 800; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--crit); flex: none; }
  .dot.on { background: var(--accent); }
  #hostline { color: var(--dim); font-size: 12px; text-align: right; }
  main { padding: 16px; max-width: 900px; margin: 0 auto; overflow-x: hidden; }
  .tab { display: none; } .tab.active { display: block; }
  h2 { color: var(--accent); font-size: 13px; letter-spacing: 2px; margin: 22px 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 14px; min-height: 120px; min-width: 0; }
  .tile .lbl { color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .tile .val { font-size: clamp(22px, 8vw, 30px); font-weight: 800; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { color: var(--dim); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .kv { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 4px 0; }
  .kv span:first-child { flex: none; max-width: 55%; }
  .kv span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .kv span:first-child { color: var(--dim); } .kv span:last-child { font-weight: 600; text-align: right; }
  .ctitle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .ctitle b { color: var(--accent); letter-spacing: 1.5px; font-size: 13px; }
  .ctitle .big { font-size: 22px; font-weight: 800; }
  .name { font-weight: 600; margin-bottom: 8px; }
  canvas { width: 100%; height: 70px; display: block; }
  .cores { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .core { width: 22px; height: 40px; background: var(--border); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
  .core > div { width: 100%; background: var(--accent); }
  .warn { display: flex; gap: 10px; padding: 6px 0; align-items: flex-start; }
  .chip { display: inline-block; white-space: nowrap; flex: none; align-self: flex-start; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 1px; border: 1px solid; }
  .game { cursor: pointer; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 8px; }
  .metrics .m b { display: block; font-size: 22px; font-weight: 800; }
  .metrics .m span { color: var(--dim); font-size: 11px; }
  .small { color: var(--dim); font-size: 12px; }
  .tips { display: none; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .game.open .tips { display: block; }
  .tips div { padding: 4px 0 4px 16px; position: relative; line-height: 1.35; }
  .tips div::before { content: "›"; color: var(--accent); position: absolute; left: 2px; }
  .banner { border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; display: none; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bar); display: flex;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); z-index: 5; }
  nav button { flex: 1; background: none; border: 0; color: var(--dim); font-size: 11px; font-weight: 700;
    letter-spacing: 1px; padding: 8px 0; border-radius: 12px; }
  nav button .ic { display: block; font-size: 20px; margin-bottom: 2px; }
  nav button.active { color: var(--accent); background: rgba(74,222,128,.08); }
  #offline { display: none; text-align: center; padding: 40px 20px; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 0; } td.r { text-align: right; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>GAMINGSUITE X</h1>
  <div id="hostline">verbinde …</div>
</header>

<main>
  <div id="offline">
    <div style="font-size:42px">⚠️</div>
    <p><b style="color:var(--text)">Keine Verbindung zum PC</b></p>
    <p>GamingSuite X am PC starten.<br>Handy und PC müssen im selben WLAN sein.</p>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <section class="tab active" id="tab-dash">
    <div class="banner" id="gameBanner"></div>
    <div class="grid">
      <div class="tile"><div class="lbl">CPU</div><div class="val" id="tCpu">--</div><div class="sub" id="sCpu"></div><div class="bar"><div id="bCpu"></div></div></div>
      <div class="tile"><div class="lbl">GPU</div><div class="val" id="tGpu">--</div><div class="sub" id="sGpu"></div><div class="bar"><div id="bGpu"></div></div></div>
      <div class="tile"><div class="lbl">RAM</div><div class="val" id="tRam">--</div><div class="sub" id="sRam"></div><div class="bar"><div id="bRam"></div></div></div>
      <div class="tile"><div class="lbl">TEMPERATUR</div><div class="val" id="tTemp">--</div><div class="sub" id="sTemp"></div></div>
    </div>
    <h2>VERLAUF (60 s)</h2>
    <div class="card">
      <div class="small"><span style="color:var(--accent)">━</span> CPU &nbsp; <span style="color:var(--cyan)">━</span> GPU</div>
      <canvas id="chart"></canvas>
    </div>
    <div id="warnBox"></div>
  </section>

  <!-- ============ DIAGNOSE ============ -->
  <section class="tab" id="tab-diag">
    <div id="diag"></div>
  </section>

  <!-- ============ SPIELE ============ -->
  <section class="tab" id="tab-games">
    <div class="card" id="gamesHead"></div>
    <div id="tuning"></div>
    <h2>MESSUNGEN</h2>
    <div id="games"><div class="small">Lade …</div></div>
  </section>
</main>

<nav>
  <button class="active" data-tab="dash"><span class="ic">▦</span>DASHBOARD</button>
  <button data-tab="diag"><span class="ic">✚</span>DIAGNOSE</button>
  <button data-tab="games"><span class="ic">🎮</span>SPIELE</button>
</nav>

<script>
"use strict";
const $ = id => document.getElementById(id);
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => (typeof v === "number" && isFinite(v)) ? v : (v != null && v !== "" && !isNaN(+v) ? +v : null);
const fmt = (v, d = 0) => num(v) == null ? "--" : num(v).toFixed(d);
function fmtBytes(b) {
  b = num(b); if (b == null) return "--";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(b >= 100 || i === 0 ? 0 : 1) + " " + u[i];
}
const fmtRate = b => num(b) == null ? "--" : fmtBytes(b) + "/s";
function fmtUptime(s) { s = num(s) || 0; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h ${m}m` : (h ? `${h}h ${m}m` : `${m}m`); }
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function loadColor(v, warn = 75, crit = 90) { v = num(v); if (v == null) return "var(--dim)"; return v >= crit ? "var(--crit)" : v >= warn ? "var(--warn)" : "var(--accent)"; }
const tempColor = v => loadColor(v, 75, 88);
function ratingColor(r) { return { GUT: "var(--accent)", GELEGENTLICH: "var(--warn)", MITTEL: "var(--warn)", RUCKLER: "var(--crit)", AUFWAERMEN: "var(--info)" }[r] || "var(--dim)"; }
const ratingText = r => r === "AUFWAERMEN" ? "AUFWÄRMEN" : r;

// ---------------------------------------------------------------- Tabs
let currentTab = "dash";
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  currentTab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === "tab-" + currentTab));
  if (currentTab === "games") loadGames();
  if (lastStats) render(lastStats);
}));

// ---------------------------------------------------------------- Daten
let lastStats = null, failures = 0;
const hist = { cpu: [], gpu: [] };
function push(list, v) { v = num(v); if (v == null) return; list.push(v); if (list.length > 60) list.shift(); }

// Optionale PIN (am PC unter Settings festgelegt)
let pinAsked = false, pinPauseUntil = 0;
function getPin() { try { return localStorage.getItem("gsxPin") || ""; } catch (e) { return window._gsxPin || ""; } }
function setPin(p) { try { localStorage.setItem("gsxPin", p); } catch (e) { window._gsxPin = p; } }

async function getJson(path) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 3000);
  try {
    const r = await fetch(path, { cache: "no-store", signal: ctrl.signal, headers: { "X-GSX-Pin": getPin() } });
    if (r.status === 401 && !pinAsked && Date.now() > pinPauseUntil) {
      pinAsked = true;
      const p = window.prompt("PIN für GamingSuite X eingeben (steht am PC unter Settings):", "");
      pinAsked = false;
      if (p) { setPin(p.trim()); return getJson(path); }
      pinPauseUntil = Date.now() + 60000;   // abgebrochen -> 1 Minute nicht erneut fragen
    }
    if (r.status === 403) { $("offline").innerHTML = "<p><b style='color:var(--text)'>Zugriff am PC abgeschaltet</b></p><p>GamingSuite X → Settings → Handy-/Browser-Zugriff erlauben.</p>"; }
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  }
  finally { clearTimeout(t); }
}

async function loadStats() {
  if (document.hidden) return;
  try {
    const s = await getJson("/api/stats");
    failures = 0; lastStats = s;
    push(hist.cpu, s.cpu && s.cpu.usage);
    push(hist.gpu, mainGpu(s) && mainGpu(s).usage);
    setOnline(true, s);
    render(s);
  } catch (e) { if (++failures >= 3) setOnline(false); }
}

function setOnline(on, s) {
  $("dot").classList.toggle("on", on);
  $("offline").style.display = on || lastStats ? "none" : "block";
  if (on && s) $("hostline").innerHTML = esc(s.hostname) + "<br>" + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  else if (!on) $("hostline").textContent = "getrennt";
}

function mainGpu(s) { const g = arr(s.gpus); return g.find(x => num(x.usage) != null && x.vendor !== "Intel") || g[0] || null; }
function hottest(s) { const v = [num(s.cpu && s.cpu.temp), ...arr(s.gpus).map(g => num(g.temp))].filter(x => x != null); return v.length ? Math.max(...v) : null; }

// ---------------------------------------------------------------- Rendern
function setTile(id, value, unit, sub, level, color) {
  $("t" + id).textContent = value == null ? "n/v" : value + unit;
  $("t" + id).style.color = color;
  $("s" + id).textContent = sub || "";
  const bar = $("b" + id); if (bar) { bar.style.width = Math.max(0, Math.min(100, num(level) || 0)) + "%"; bar.style.background = color; }
}

function render(s) {
  if (currentTab === "dash") renderDash(s);
  if (currentTab === "diag") renderDiag(s);
  if (currentTab === "games") renderGamesHead();
}

function renderDash(s) {
  const g = mainGpu(s), t = hottest(s);
  setTile("Cpu", num(s.cpu && s.cpu.usage) == null ? null : Math.round(s.cpu.usage), " %", s.cpu && s.cpu.name, s.cpu && s.cpu.usage, loadColor(s.cpu && s.cpu.usage));
  setTile("Gpu", g && num(g.usage) != null ? Math.round(g.usage) : null, " %", g ? g.name : "keine GPU erkannt", g && g.usage, loadColor(g && g.usage));
  setTile("Ram", num(s.ram && s.ram.percent) == null ? null : Math.round(s.ram.percent), " %", `${fmtBytes(s.ram && s.ram.used)} / ${fmtBytes(s.ram && s.ram.total)}`, s.ram && s.ram.percent, loadColor(s.ram && s.ram.percent, 85, 95));
  setTile("Temp", t == null ? null : Math.round(t), " °C", t == null ? "Sensor nicht verfügbar" : "höchster Wert CPU/GPU", null, tempColor(t));

  const gm = s.game, b = $("gameBanner");
  if (gm) {
    b.style.display = "block";
    if (gm.measuring) { b.style.background = "rgba(248,113,113,.12)"; b.style.color = "var(--crit)"; b.textContent = `● ${gm.name} – FPS-Messung läuft` + (num(gm.secondsLeft) != null ? ` (${mmss(gm.secondsLeft)})` : ""); }
    else if (num(gm.waitSeconds) > 0) { b.style.background = "rgba(251,191,36,.12)"; b.style.color = "var(--warn)"; b.textContent = `🎮 ${gm.name} – Messung startet in ${mmss(gm.waitSeconds)}`; }
    else { b.style.background = "rgba(74,222,128,.10)"; b.style.color = "var(--accent)"; b.textContent = `🎮 ${gm.name} läuft`; }
  } else b.style.display = "none";

  drawChart();
  const w = arr(s.warnings).filter(x => x.level === "crit" || x.level === "warn");
  $("warnBox").innerHTML = w.length ? `<h2>DIAGNOSE</h2><div class="card">` + w.map(x =>
    `<div class="warn"><span style="color:${x.level === "crit" ? "var(--crit)" : "var(--warn)"}">${x.level === "crit" ? "⛔" : "⚠️"}</span><span>${esc(x.text)}</span></div>`).join("") + `</div>` : "";
}

function drawChart() {
  const c = $("chart"), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr); x.clearRect(0, 0, w, h);
  x.strokeStyle = "#262d3a"; x.lineWidth = 1;
  for (let i = 1; i < 4; i++) { x.beginPath(); x.moveTo(0, h * i / 4); x.lineTo(w, h * i / 4); x.stroke(); }
  const line = (d, col) => {
    if (d.length < 2) return; const dx = w / 59, x0 = w - (d.length - 1) * dx;
    x.strokeStyle = col; x.lineWidth = 2; x.beginPath();
    d.forEach((v, i) => { const px = x0 + i * dx, py = h - Math.max(0, Math.min(100, v)) / 100 * h; i ? x.lineTo(px, py) : x.moveTo(px, py); });
    x.stroke();
  };
  line(hist.gpu, "#22d3ee"); line(hist.cpu, "#4ade80");
}

function kv(label, value, color) { return `<div class="kv"><span>${esc(label)}</span><span${color ? ` style="color:${color}"` : ""}>${esc(value)}</span></div>`; }
function card(title, big, bigColor, body) {
  return `<div class="card"><div class="ctitle"><b>${title}</b>${big != null ? `<span class="big" style="color:${bigColor}">${esc(big)}</span>` : ""}</div>${body}</div>`;
}

function renderDiag(s) {
  const c = s.cpu || {}, h = [];
  const warns = arr(s.warnings);
  if (warns.length) h.push(card("DIAGNOSE", null, null, warns.map(w =>
    `<div class="warn"><span>${w.level === "crit" ? "⛔" : w.level === "warn" ? "⚠️" : "ℹ️"}</span><span>${esc(w.text)}</span></div>`).join("")));

  const cores = arr(c.per_core).map(v => `<div class="core"><div style="height:${Math.max(3, Math.min(100, num(v) || 0))}%;background:${loadColor(v)}"></div></div>`).join("");
  h.push(card("CPU", fmt(c.usage) + " %", loadColor(c.usage),
    `<div class="name">${esc(c.name)}</div>` +
    kv("Temperatur", num(c.temp) == null ? "n/v" : fmt(c.temp) + " °C", tempColor(c.temp)) +
    kv("Takt", num(c.freq_mhz) == null ? "n/v" : fmt(c.freq_mhz) + " MHz" + (num(c.freq_max_mhz) ? ` (max ${fmt(c.freq_max_mhz)})` : "")) +
    kv("Kerne / Threads", `${c.cores_physical ?? "-"} / ${c.cores_logical ?? "-"}`) +
    (cores ? `<div class="small" style="margin-top:10px">Auslastung pro Thread</div><div class="cores">${cores}</div>` : "")));

  arr(s.gpus).forEach(g => {
    let body = `<div class="name">${esc(g.name)}</div>` + kv("Temperatur", num(g.temp) == null ? "n/v" : fmt(g.temp) + " °C", tempColor(g.temp));
    if (num(g.mem_total_mb)) body += kv("VRAM", `${fmtBytes((num(g.mem_used_mb) || 0) * 1048576)} / ${fmtBytes(g.mem_total_mb * 1048576)}`);
    if (num(g.power_w) != null) body += kv("Verbrauch", fmt(g.power_w) + " W");
    if (g.driver) body += kv("Treiber", g.driver);
    h.push(card("GPU", num(g.usage) == null ? "n/v" : fmt(g.usage) + " %", loadColor(g.usage), body));
  });

  const r = s.ram || {};
  h.push(card("ARBEITSSPEICHER", fmt(r.percent) + " %", loadColor(r.percent, 85, 95),
    kv("Belegt", `${fmtBytes(r.used)} / ${fmtBytes(r.total)}`) + (num(s.swap && s.swap.total) ? kv("Auslagerung", `${fmtBytes(s.swap.used)} / ${fmtBytes(s.swap.total)}`) : "")));

  const disks = arr(s.disks);
  if (disks.length) h.push(card("LAUFWERKE", null, null, disks.map(d =>
    kv(`${d.mount} (${d.fs})`, `${fmtBytes(d.used)} / ${fmtBytes(d.total)}`, loadColor(d.percent, 90, 95)) +
    `<div class="bar" style="margin-bottom:8px"><div style="width:${num(d.percent) || 0}%;background:${loadColor(d.percent, 90, 95)}"></div></div>`).join("") +
    kv("Lesen", fmtRate(s.disk_io && s.disk_io.read_bps)) + kv("Schreiben", fmtRate(s.disk_io && s.disk_io.write_bps))));

  h.push(card("NETZWERK", null, null, kv("Download", fmtRate(s.net && s.net.down_bps)) + kv("Upload", fmtRate(s.net && s.net.up_bps))));

  const procs = arr(s.processes);
  if (procs.length) h.push(card("TOP-PROZESSE", null, null, "<table>" + procs.map(p =>
    `<tr><td>${esc(p.name)}</td><td class="r" style="color:${loadColor(p.cpu, 30, 60)}">${fmt(p.cpu, 1)} %</td><td class="r">${fmtBytes((num(p.mem_mb) || 0) * 1048576)}</td></tr>`).join("") + "</table>"));

  h.push(card("SYSTEM", null, null, kv("PC-Name", s.hostname) + kv("Betriebssystem", s.os) + kv("Laufzeit", fmtUptime(s.uptime_s))));
  $("diag").innerHTML = h.join("");
}

// ---------------------------------------------------------------- Spiele
let gamesData = null;
const openGames = new Set();

async function loadGames() {
  if (document.hidden) return;
  try { gamesData = await getJson("/api/games"); renderGames(); }
  catch (e) { if (!gamesData) $("games").innerHTML = `<div class="small">Keine Spieldaten – GamingSuite X am PC aktualisieren.</div>`; }
}

function renderGamesHead() {
  const d = gamesData || {}, gm = lastStats && lastStats.game;
  let status = "Kein Spiel aktiv", col = "var(--dim)";
  if (gm) {
    if (gm.measuring) { status = `● ${gm.name} – Messung läuft` + (num(gm.secondsLeft) != null ? ` (${mmss(gm.secondsLeft)})` : ""); col = "var(--crit)"; }
    else if (num(gm.waitSeconds) > 0) { status = `${gm.name} – Messung startet in ${mmss(gm.waitSeconds)}`; col = "var(--warn)"; }
    else { status = `${gm.name} läuft`; col = "var(--text)"; }
  }
  $("gamesHead").innerHTML = `<div class="kv"><span style="color:var(--text);font-weight:700">🎯 Ziel: ${d.target ?? "--"} FPS</span><span class="small">${d.monitorHz ? "Monitor " + d.monitorHz + " Hz" : ""}</span></div>` +
    `<div style="color:${col};font-weight:600;margin-top:8px">${esc(status)}</div>`;
}

function renderGames() {
  const d = gamesData || {};
  renderGamesHead();
  const tun = arr(d.tuning);
  $("tuning").innerHTML = tun.length ? `<h2>AUTO-TUNING</h2>` + tun.map(t =>
    `<div class="card" style="padding:12px 16px"><div class="kv"><span style="color:var(--text);font-weight:600">${esc(t.name)}</span>` +
    `<span style="color:${t.level >= 1 ? "var(--accent)" : "var(--dim)"}">${t.level >= 1 ? `Stufe ${t.level} · ${esc(t.levelName)}` : "nicht optimiert"}</span></div>` +
    (t.pending != null ? `<div class="small" style="color:var(--warn)">→ Stufe ${t.pending} nach Spielende</div>` : "") + `</div>`).join("") : "";

  const games = arr(d.games);
  if (!games.length) { $("games").innerHTML = `<div class="small" style="text-align:center;padding:20px">Noch keine Messung – am PC ein Spiel 3–4 Minuten spielen, GamingSuite X misst automatisch.</div>`; return; }
  $("games").innerHTML = games.map((g, i) => {
    const target = num(g.target) || 0, rc = ratingColor(g.rating), hpm = num(g.hitchesPerMin);
    const fpsCol = v => (num(v) == null || !target) ? "var(--text)" : v >= target * .93 ? "var(--accent)" : v >= target * .7 ? "var(--warn)" : "var(--crit)";
    const hCol = hpm == null ? "var(--text)" : hpm < 2 ? "var(--accent)" : hpm <= 10 ? "var(--warn)" : "var(--crit)";
    const extra = [num(g.gpu) != null ? `GPU ${g.gpu} %` : "", num(g.core) != null ? `Kern ${g.core} %` : "", num(g.vram) != null ? `VRAM ${g.vram} %` : "",
      g.fgActive ? `FG an (echt ${g.baseAvg ?? "-"})` : (g.fg ? `FG ${g.fg}` : ""),
      g.date ? new Date(g.date).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : ""].filter(Boolean).join(" · ");
    const key = g.key || String(i);
    return `<div class="card game${openGames.has(key) ? " open" : ""}" data-key="${esc(key)}" style="border-color:${rc}66">
      <div class="kv"><span style="color:var(--text);font-weight:700;font-size:16px">${esc(g.name)}</span>
      <span class="chip" style="color:${rc};border-color:${rc};background:${rc}22">${esc(ratingText(g.rating))}</span></div>
      <div class="metrics">
        <div class="m"><b style="color:${fpsCol(g.avg)}">${g.avg ?? "-"}</b><span>Ø FPS</span></div>
        <div class="m"><b>${g.low ?? "-"}</b><span>1%-Low</span></div>
        <div class="m"><b>${g.low01 ?? "-"}</b><span>0,1%-Low</span></div>
        <div class="m"><b style="color:${hCol}">${hpm == null ? "-" : hpm.toFixed(1)}</b><span>Hänger/min</span></div>
      </div>
      <div class="small">${esc(extra)}</div>
      <div class="tips">${arr(g.tips).map(t => `<div>${esc(t)}</div>`).join("") || "<div>Keine Empfehlungen.</div>"}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".game").forEach(el => el.addEventListener("click", () => {
    const k = el.dataset.key; openGames.has(k) ? openGames.delete(k) : openGames.add(k); el.classList.toggle("open");
  }));
}

// ---------------------------------------------------------------- Start
loadStats(); loadGames();
setInterval(loadStats, 1000);
setInterval(loadGames, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadStats(); loadGames(); } });
window.addEventListener("resize", drawChart);
</script>
</body>
</html>
